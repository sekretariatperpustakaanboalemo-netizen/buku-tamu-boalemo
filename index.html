<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Tamu Digital - Kab. Boalemo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{background:#eef2f0;min-height:100vh;padding-bottom:30px}
.header{background:#15803d;color:white;padding:18px 16px 32px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:14px}
.logo-box{background:white;border-radius:14px;padding:6px;width:62px;height:62px;display:flex;align-items:center;justify-content:center}
.container{max-width:480px;margin:-20px auto 0;padding:0 16px}
.card{background:white;border-radius:24px;padding:22px 18px;box-shadow:0 8px 30px rgba(0,0,0,0.08);margin-top:12px}
  input,select,textarea{width:100%;padding:13px 14px;border:1.8px solid #d1d5db;border-radius:14px;background:#f9fafb}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#15803d;background:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:600;cursor:pointer}
.btn-gray{background:#f3f4f6}.btn-outline{border:1.5px solid #15803d;color:#15803d;background:white}
.btn-submit{width:100%;background:#15803d;color:white;padding:16px;border:none;border-radius:16px;font-size:16px;font-weight:700;margin-top:18px}
  label{font-size:13px;font-weight:600;color:#14532d;display:block;margin-top:15px;margin-bottom:6px}
.privacy{display:flex;gap:10px;background:#f9fafb;padding:12px;border-radius:12px;margin-top:18px;font-size:11px}
.signature-area{border:1.8px solid #d1d5db;border-radius:14px;height:140px;background:#f9fafb;margin-top:8px}
.other-input{display:none;margin-top:10px}
</style>
</head>
<body>
<div class="header">
  <div class="logo-box"><img src="logo-boalemo.png" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Lambang_Kabupaten_Boalemo.png/400px-Lambang_Kabupaten_Boalemo.png'" style="width:100%"></div>
  <div><h1 style="font-size:20px">Buku Tamu Digital</h1><p style="font-size:12px;opacity:0.9">Kabupaten Boalemo</p></div>
</div>
<div class="container">
  <div class="card" id="formCard">
    <h2 style="color:#14532d">Form Kunjungan</h2>
    <p style="color:#6b7280;font-size:13px;margin-bottom:12px">Silakan lengkapi data kunjungan Anda</p>
    <label>Nama Lengkap *</label><input placeholder="Masukkan nama lengkap">
    <label>Instansi / Asal *</label><input placeholder="Contoh: SMAN 1 Tilamuta">
    <div class="row">
      <div><label>No HP / WA *</label><input placeholder="08xxxxxxxxxx"></div>
      <div>
        <label>Keperluan *</label>
        <select id="keperluan" required>
          <option value="" disabled selected>-- Pilih Keperluan --</option>
          <option>Konsultasi</option>
          <option>Menghadiri Rapat</option>
          <option>Kegiatan Literasi</option>
          <option>Pemustaka</option>
          <option>Kegiatan Lainnya</option>
        </select>
        <input type="text" id="keperluanLain" class="other-input" placeholder="Tulis kegiatan lainnya...">
      </div>
    </div>
    <label>Bidang / Pegawai yang Dituju</label><input placeholder="Contoh: Bidang Kearsipan">
    <label>Keterangan</label><textarea rows="2" placeholder="Tulis keterangan..."></textarea>
    <label>Tanda Tangan (opsional)</label>
    <div class="signature-area"><canvas id="sigCanvas" width="440" height="140" style="width:100%;height:100%"></canvas></div>
    <div style="text-align:right;margin-top:6px"><button class="btn btn-gray" onclick="hapusTtd()">Hapus Tanda Tangan</button></div>
    <div class="privacy"><input type="checkbox" id="setuju"><label for="setuju" style="margin:0;font-weight:400">Saya menyetujui data pribadi saya dikumpulkan sesuai UU No.27 Tahun 2022.</label></div>
    <button class="btn-submit" onclick="kirimData()">✓ Kirim Data Kunjungan</button>
  </div>
  <div class="card" id="successCard" style="display:none;text-align:center;padding:30px"><h2 style="color:#15803d">Terima Kasih ✓</h2><p style="color:#6b7280;margin-top:8px">Kunjungan Anda telah tercatat.</p><button class="btn btn-outline" style="width:100%;margin-top:16px" onclick="location.reload()">Isi untuk Tamu Lain</button></div>
</div>
<script>
const keperluanEl=document.getElementById('keperluan'), lainnyaEl=document.getElementById('keperluanLain');
keperluanEl.addEventListener('change',function(){lainnyaEl.style.display=this.value==='Kegiatan Lainnya'?'block':'none'});
const canvas=document.getElementById('sigCanvas'),ctx=canvas.getContext('2d');let drawing=false;
function getPos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
canvas.addEventListener('touchstart',e=>{drawing=true;ctx.beginPath();const p=getPos(e);ctx.moveTo(p.x,p.y)});
canvas.addEventListener('touchmove',e=>{if(!drawing)return;e.preventDefault();const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke()},{passive:false});
canvas.addEventListener('touchend',()=>drawing=false);
function hapusTtd(){ctx.clearRect(0,0,440,140)}
function kirimData(){if(!document.getElementById('setuju').checked){alert('Centang persetujuan dulu');return}document.getElementById('formCard').style.display='none';document.getElementById('successCard').style.display='block';}
</script>
</body>
</html>
